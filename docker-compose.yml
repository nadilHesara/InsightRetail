version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: insightretail-db
    environment:
      POSTGRES_USER: insightretail
      POSTGRES_PASSWORD: insightretail
      POSTGRES_DB: insightretail
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightretail"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: insightretail-backend
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://insightretail:insightretail@db:5432/insightretail
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  dashboard:
    image: python:3.13-slim
    container_name: insightretail-dashboard
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      PYTHONUNBUFFERED: 1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
